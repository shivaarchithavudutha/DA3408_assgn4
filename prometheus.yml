# ==============================================================================
# DA3408 Assignment 4: Application Monitoring & Observability
# Prometheus Scrape Configuration
# ==============================================================================

global:
  scrape_interval: 2s      # Frequent polling to visualize real-time spikes in Grafana
  evaluation_interval: 2s

# ------------------------------------------------------------------------------
# ATTRIBUTION (Code of Conduct - Fair Use of AI):
# The following PromQL expressions used in Grafana were formulated with AI assistance:
#
# 1. Total CPU Utilization (%):
#    Prompt: "Write a PromQL expression using node_exporter to compute host CPU usage percentage."
#    Query:  100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[30s])) * 100)
#
# 2. P95 Inference Latency:
#    Prompt: "Write a PromQL histogram_quantile query to calculate p95 inference time per image."
#    Query:  histogram_quantile(0.95, sum by (le) (rate(caption_inference_duration_seconds_bucket[1m])))
#
# 3. Success Throughput (req/s):
#    Prompt: "Write a PromQL query for per-second throughput of successful captions partitioned by mode."
#    Query:  sum by (mode) (rate(caption_images_processed_total{status="success"}[30s]))
# ------------------------------------------------------------------------------

scrape_configs:
  - job_name: 'streamlit_ai_app'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']
